<!doctype html>
<!-- TEMPORARY verification harness for the spine-hinge fix. Delete before commit. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loading</title>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="book-scene" aria-label="Interactive three-dimensional photo book"></canvas>
      <nav class="library" aria-label="Select a photo book" id="library"></nav>
      <div class="reader-controls" aria-label="Page controls">
        <button class="page-button" id="previous-page" type="button" aria-label="Previous page"><span aria-hidden="true">‹</span></button>
        <button class="page-button" id="next-page" type="button" aria-label="Next page"><span aria-hidden="true">›</span></button>
        <button class="page-button" id="rotate-view" type="button" aria-pressed="false" aria-label="Rotate"><span aria-hidden="true">⟲</span></button>
        <span class="sr-only" id="page-state" aria-live="polite">Cover</span>
      </div>
      <div class="loading-card" id="loading-card" role="status" aria-live="polite" aria-hidden="true" hidden>
        <span class="loading-pulse"></span>
        <span class="sr-only" id="loading-copy">Preparing edition</span>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const progress = Number.parseFloat(params.get("p") ?? "0");
      const hideSpine = params.get("spine") === "off";

      const ready = async () => {
        const debug = window.__passportDebug;
        if (!debug?.coverSpine) return false;
        if (debug.flipBook.pages.length === 0) return false;
        return true;
      };

      const start = performance.now();
      const poll = async () => {
        if (await ready()) {
          const debug = window.__passportDebug;
          if (hideSpine) debug.coverSpine.visible = false;
          const book = debug.flipBook;
          book.progress = 0;
          book.progress = progress;
          for (const sheet of book) sheet.page.geometry.computeVertexNormals();
          let frames = 0;
          const draw = () => {
            debug.renderer.render(debug.scene, debug.camera);
            frames += 1;
            if (frames < 30) requestAnimationFrame(draw);
            else document.title = "ready";
          };
          draw();
          return;
        }
        if (performance.now() - start > 20000) {
          document.title = "timeout";
          return;
        }
        setTimeout(poll, 60);
      };
      poll();
    </script>
  </body>
</html>
