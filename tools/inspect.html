<!doctype html>
<!-- TEMPORARY: before/after contact-sheet harness for the case-binding rebuild. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inspect</title>
    <script>window.__BINDING_HARNESS__ = true;</script>
  </head>
  <body>
    <main class="app-shell">
      <canvas id="book-scene" aria-label="Interactive three-dimensional photo book"></canvas>
      <nav class="library" aria-label="Select a photo book" id="library"></nav>
      <div class="reader-controls" aria-label="Page controls">
        <button class="page-button" id="previous-page" type="button" aria-label="Previous page"><span aria-hidden="true">&lsaquo;</span></button>
        <button class="page-button" id="next-page" type="button" aria-label="Next page"><span aria-hidden="true">&rsaquo;</span></button>
        <button class="page-button" id="rotate-view" type="button" aria-pressed="false" aria-label="Rotate"><span aria-hidden="true">&#8635;</span></button>
        <span class="sr-only" id="page-state" aria-live="polite">Cover</span>
      </div>
      <div class="loading-card" id="loading-card" role="status" aria-live="polite" aria-hidden="true" hidden>
        <span class="loading-pulse"></span>
        <span class="sr-only" id="loading-copy">Preparing edition</span>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/tools/inspect.mjs"></script>
    <script type="module" src="/tools/invariants.mjs"></script>
    
  </body>
</html>
